<section
  class="product-grid"
  id="product-grid"
  aria-live="polite"
  aria-busy="false"
  data-next-page="{{ next_page|default:'' }}"
>
  {% include 'storefront/_product_cards.html' %}
</section>

{% if has_next %}
  <div class="load-more-wrap" id="load-more-wrap">
    <button
      type="button"
      class="button load-more-button"
      id="load-more-products"
      data-next-page="{{ next_page }}"
    >Carregar mais produtos</button>
  </div>
{% else %}
  <div id="load-more-wrap" class="load-more-wrap" hidden></div>
{% endif %}
