{% load static %}
<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="{{ branding.primary_color|default:'#635bff' }}"><title>{% block title %}{{ tenant.name }} | pediu.{% endblock %}</title><link rel="stylesheet" href="{% static 'css/storefront.css' %}"></head>
<body style="--store-primary: {{ branding.primary_color|default:'#635bff' }}"><header class="topbar"><a class="brand" href="{% url 'storefront:store' tenant.slug %}"><span class="brand-mark">p.</span><span>{{ tenant.name }}</span></a><a class="cart-link" href="{% url 'storefront:cart' tenant.slug %}">Carrinho <span>🛒</span></a></header><main class="container">{% if messages %}<div class="messages">{% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% block content %}{% endblock %}</main><footer class="footer">Loja online com <strong>pediu.</strong></footer></body></html>
