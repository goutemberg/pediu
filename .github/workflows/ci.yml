name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pediu_test
          POSTGRES_USER: pediu
          POSTGRES_PASSWORD: pediu_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pediu -d pediu_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret
      DEBUG: "False"
      DATABASE_URL: postgres://pediu:pediu_test_password@localhost:5432/pediu_test
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/local.txt
      - run: pip install -r requirements/local.txt
      - name: Ruff
        run: ruff check .
      - name: Generate initial migrations
        run: python manage.py makemigrations accounts tenants catalog customers inventory orders notifications subscriptions
      - name: Migrate
        run: python manage.py migrate
      - name: Tests and coverage
        run: pytest --cov=apps --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
